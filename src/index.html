<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Invoice — Factures & Devis Professionnels (Afrique & International)</title>
  <meta name="description" content="Créez des factures et devis professionnels en 60 secondes avec devises africaines (FCFA, Naira, Cedi, Dirham) et paiement direct Mobile Money (Wave, Orange, MTN) ou Stripe.">
  
  <!-- Tailwind CSS via CDN pour légèreté & zéro build complexe -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- html2pdf.js pour la génération de PDF vectoriel côté client -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="h-full text-slate-100 flex flex-col font-sans">

  <!-- BARRE DE NAVIGATION SUPÉRIEURE (no-print) -->
  <header class="no-print bg-slate-800 border-b border-slate-700/80 px-4 py-3 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      
      <!-- Brand & Titre -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
          <span class="text-xl">⚡</span>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-lg font-extrabold tracking-tight text-white font-heading">Smart Invoice</span>
            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">Mini-SaaS</span>
          </div>
          <p class="text-xs text-slate-400 hidden sm:block">Facturation Pro • Devises Africaines • Mobile Money & Stripe</p>
        </div>
      </div>

      <!-- Actions Principales -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <button id="btn-reset" type="button" class="px-3 py-2 text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg transition-colors flex items-center space-x-1" title="Créer une nouvelle facture">
          <span>🔄</span>
          <span class="hidden sm:inline">Nouveau</span>
        </button>

        <button id="btn-share-whatsapp" type="button" class="px-3.5 py-2 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg shadow-sm transition-all flex items-center space-x-1.5" title="Partager le récapitulatif sur WhatsApp">
          <span>💬</span>
          <span class="hidden sm:inline">WhatsApp</span>
        </button>

        <button id="btn-download-pdf" type="button" class="px-4 py-2 text-xs font-bold text-white bg-blue-600 hover:bg-blue-500 rounded-lg shadow-lg shadow-blue-600/30 transition-all flex items-center space-x-1.5">
          <span>📥</span>
          <span>Télécharger PDF</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ONGLETS DE BASCULE SUR MOBILE (no-print) -->
  <div class="no-print lg:hidden bg-slate-800/90 border-b border-slate-700 px-4 py-2 flex justify-center space-x-2">
    <button id="tab-edit" class="flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition-all text-center">
      ✏️ Éditeur
    </button>
    <button id="tab-preview" class="flex-1 py-2 text-xs font-bold rounded-lg bg-slate-700 text-slate-300 transition-all text-center">
      📄 Aperçu Facture
    </button>
  </div>

  <!-- CONTENU PRINCIPAL : Grille Éditeur + Aperçu Direct -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- PANNEAU GAUCHE : L'Éditeur Réactif (no-print) -->
    <section id="panel-editor" class="no-print lg:col-span-6 bg-slate-800 rounded-2xl p-5 sm:p-6 border border-slate-700/80 shadow-xl space-y-6">
      
      <!-- 1. Type de document & Numéro -->
      <div class="space-y-3 pb-5 border-b border-slate-700">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Type de document</label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center justify-center space-x-2 p-2.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-blue-500 transition-all">
            <input type="radio" name="docType" value="FACTURE" class="text-blue-600 focus:ring-0" checked>
            <span class="text-sm font-bold text-slate-200">Facture</span>
          </label>
          <label class="flex items-center justify-center space-x-2 p-2.5 rounded-xl border border-slate-700 bg-slate-900/60 cursor-pointer hover:border-blue-500 transition-all">
            <input type="radio" name="docType" value="DEVIS" class="text-blue-600 focus:ring-0">
            <span class="text-sm font-bold text-slate-200">Devis</span>
          </label>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">N° de document</label>
            <input id="invoice-number" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none font-mono">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Date d'émission</label>
            <input id="issue-date" type="date" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Échéance</label>
            <input id="due-date" type="date" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none">
          </div>
        </div>
      </div>

      <!-- 2. Devise & Zone Monétaire -->
      <div class="space-y-1.5 pb-5 border-b border-slate-700">
        <label for="currency-select" class="block text-xs font-bold uppercase tracking-wider text-slate-400">
          🌍 Devise & Zone Monétaire
        </label>
        <select id="currency-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:border-blue-500 focus:outline-none font-medium">
          <!-- Injecté dynamiquement par currencies.js -->
        </select>
        <p class="text-[11px] text-slate-400">Supporte le Franc CFA (XOF/XAF), Naira, Cedi, Dirham, Shilling, EUR, USD...</p>
      </div>

      <!-- 3. Émetteur & Destinataire -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pb-5 border-b border-slate-700">
        
        <!-- Émetteur -->
        <div class="space-y-2">
          <span class="text-xs font-bold uppercase tracking-wider text-blue-400 block">Émetteur (Vous)</span>
          <input id="sender-name" type="text" placeholder="Nom de votre Entreprise" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
          <input id="sender-title" type="text" placeholder="Activité / Slogan" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
          <input id="sender-phone" type="text" placeholder="Téléphone / WhatsApp" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
          <input id="sender-email" type="email" placeholder="Email professionnel" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
          <input id="sender-address" type="text" placeholder="Ville, Pays" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
        </div>

        <!-- Client -->
        <div class="space-y-2">
          <span class="text-xs font-bold uppercase tracking-wider text-amber-400 block">Client (Destinataire)</span>
          <input id="client-name" type="text" placeholder="Nom du Client ou Société" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
          <input id="client-phone" type="text" placeholder="Téléphone Client" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
          <input id="client-email" type="email" placeholder="Email Client" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
          <input id="client-address" type="text" placeholder="Adresse du Client" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:border-blue-500 focus:outline-none">
        </div>

      </div>

      <!-- 4. Lignes de Prestations / Produits -->
      <div class="space-y-3 pb-5 border-b border-slate-700">
        <div class="flex items-center justify-between">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">Prestations & Tarifs</label>
          <button id="btn-add-item" type="button" class="text-xs font-bold text-blue-400 hover:text-blue-300 flex items-center space-x-1">
            <span>+ Ajouter une ligne</span>
          </button>
        </div>

        <div id="items-editor-container" class="space-y-2">
          <!-- Injecté dynamiquement par app.js -->
        </div>

        <!-- Remise & TVA -->
        <div class="grid grid-cols-2 gap-3 pt-2">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Remise commerciale (montant fixe)</label>
            <input id="discount-amount" type="number" min="0" placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:border-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">TVA (%)</label>
            <input id="tax-rate" type="number" min="0" max="100" placeholder="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:border-blue-500 focus:outline-none">
          </div>
        </div>
      </div>

      <!-- 5. Règlement : Mobile Money & Stripe -->
      <div class="space-y-3 pb-5 border-b border-slate-700">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400">
          📲 Modalités d'Encaissement
        </label>
        
        <div>
          <label for="payment-method-select" class="block text-xs text-slate-400 mb-1">Opérateur de Paiement</label>
          <select id="payment-method-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none font-medium">
            <!-- Injecté par payment-methods.js -->
          </select>
        </div>

        <div>
          <label id="payment-details-label" for="payment-details" class="block text-xs text-slate-400 mb-1">Numéro Mobile Money ou Lien Stripe</label>
          <input id="payment-details" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:border-blue-500 focus:outline-none font-mono">
        </div>
      </div>

      <!-- 6. Notes et Mentions Légales -->
      <div class="space-y-1.5">
        <label for="invoice-notes" class="block text-xs font-bold uppercase tracking-wider text-slate-400">Notes & Conditions</label>
        <textarea id="invoice-notes" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-blue-500 focus:outline-none" placeholder="Ex: Conditions de règlement, délais de livraison..."></textarea>
      </div>

    </section>

    <!-- PANNEAU DROIT : Aperçu A4 en direct & Rendu Imprimable -->
    <section id="panel-preview" class="lg:col-span-6 flex flex-col items-center">
      <div class="w-full sticky top-20">
        
        <div class="no-print mb-3 flex items-center justify-between text-xs text-slate-400 px-2">
          <span class="flex items-center space-x-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Aperçu A4 en direct</span>
          </span>
          <span>Mise à jour instantanée</span>
        </div>

        <!-- Le Document Papier A4 (Ce bloc est capturé pour le PDF) -->
        <div id="invoice-preview-container" class="invoice-paper rounded-2xl overflow-hidden">
          <!-- Rendu en direct par app.js -->
        </div>

      </div>
    </section>

  </main>

  <!-- Script d'orchestration ES Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
